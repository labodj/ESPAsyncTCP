name: ESPAsyncTCP CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run TCP regression tests with ASan and UBSan
        env:
          CXX: ${{ matrix.cxx }}
        run: python3 -m unittest discover -s tests -v
  esp8266:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        example: [examples/ClientServer/Server, examples/ClientServer/Client, examples/SyncClient]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-tcp-${{ hashFiles('platformio.ini') }}
      - run: python3 -m pip install platformio==6.2.0
      - name: Compile ESP8266 example
        env:
          PLATFORMIO_SRC_DIR: ${{ matrix.example }}
        run: python3 -m platformio run -e esp8266
